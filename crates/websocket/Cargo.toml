[package]
name = "probe-websocket"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
probe-core = { path = "../core" }
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "net", "sync"] }
tokio-websockets = { version = "0.13.3", features = ["client", "aws_lc_rs", "getrandom", "rustls-bring-your-own-connector"] }
tokio-rustls = { version = "0.26", default-features = false }
http = "1"
httparse = "1"
sha1_smol = "1"
getrandom = "0.4"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"

[dev-dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio = { version = "1.53.1", features = ["test-util"] }

[lints]
workspace = true
