[package]
name = "probe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "probe"
path = "src/main.rs"

[package.metadata.generate-rpm]
name = "probe"
summary = "A fast, native, local-first API client"
assets = [
    { source = "../../target/release/probe", dest = "/usr/bin/probe", mode = "755" },
    { source = "../../README.md", dest = "/usr/share/doc/probe/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/probe/LICENSE", mode = "644" },
]

[[bench]]
name = "performance"
harness = false

[dependencies]
probe-application = { path = "../application" }
probe-core = { path = "../core" }
probe-http = { path = "../http" }
probe-opencollection = { path = "../opencollection" }
probe-postman = { path = "../postman" }
probe-yaak = { path = "../yaak" }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1.53.1", features = ["rt", "time", "signal"] }

[lints]
workspace = true

[dev-dependencies]
criterion = "0.7.0"
serde_yaml_ng = "0.10"
