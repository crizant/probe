[package]
name = "probe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "probe"
path = "src/main.rs"

[[bench]]
name = "performance"
harness = false

[dependencies]
base64 = "0.22.1"
atomic-write-file = "0.3.1"
directories = "6.0.0"
probe-application = { path = "../application" }
probe-core = { path = "../core" }
probe-http = { path = "../http" }
probe-opencollection = { path = "../opencollection" }
probe-postman = { path = "../postman" }
probe-yaak = { path = "../yaak" }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1.53.1", features = ["rt", "time", "signal", "sync", "macros"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio = { version = "1.53.1", features = ["net", "test-util"] }
criterion = "0.7.0"
dhat = "0.3.3"
serde_yaml_ng = "0.10"
