[package]
name = "probe-desktop"
description = "A fast, native, local-first API client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.bundle]
name = "Probe"
identifier = "dev.probe.desktop"
icon = [
    "crates/desktop/assets/app-icon/macos/Probe.icns",
    "crates/desktop/assets/app-icon/windows/Probe.ico",
    "crates/desktop/assets/app-icon/linux/hicolor/32x32/apps/dev.probe.desktop.png",
    "crates/desktop/assets/app-icon/linux/hicolor/128x128/apps/dev.probe.desktop.png",
    "crates/desktop/assets/app-icon/linux/hicolor/256x256/apps/dev.probe.desktop.png",
    "crates/desktop/assets/app-icon/linux/hicolor/512x512/apps/dev.probe.desktop.png",
]
category = "Developer Tool"
short_description = "A fast, native, local-first API client"
long_description = "Probe is a native API client for working with local OpenCollection workspaces."
linux_startup_wm_class = "dev.probe.desktop"

[features]
# Opt-in instrumentation; ordinary desktop builds contain no benchmark hooks.
startup-benchmark = []

[dependencies]
atomic-write-file = "0.3.1"
directories = "6.0.0"
icondata = { version = "0.7.0", default-features = false, features = ["lucide"] }
# Kit coordinates GPUI and the unstyled base; Probe owns all presentation.
gpui-kit = { version = "0.8.0", default-features = false }
probe-application = { path = "../application" }
probe-core = { path = "../core" }
probe-http = { path = "../http" }
probe-opencollection = { path = "../opencollection" }
probe-postman = { path = "../postman" }
probe-yaak = { path = "../yaak" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"
toml_edit = "0.25.13"
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time", "fs", "net", "io-util"] }
notify = "8.2.0"
nucleo-matcher = "0.3.1"
chrono = "0.4.45"
roxmltree = "0.21.1"
quick-xml = "0.42.0"
sha2 = "0.11.0"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
# Local in-process test peer only; production streaming uses probe-application.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = "0.3.34"
tempfile = "3.27.0"
gpui-kit = { version = "0.8.0", default-features = false, features = ["test-support"] }

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.31"
