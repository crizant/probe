<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Probe app icon</title>
  <desc id="description">A close-up of the orange probe tip touching a concentric target, with the finger guard and three burnt-orange grip rings filling the upper-right edge.</desc>
  <defs>
    <radialGradient id="background" cx="1024" cy="1024" r="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EBD9B7"/>
      <stop offset=".5" stop-color="#F5EAD7"/>
      <stop offset="1" stop-color="#FAFAF8"/>
    </radialGradient>
    <pattern id="grid" x="1" y="1" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#E7E2DC" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="metal" x1="0" y1="-10" x2="0" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAEFE4"/>
      <stop offset=".16" stop-color="#E1E7D9"/>
      <stop offset=".34" stop-color="#C0C8B8"/>
      <stop offset=".72" stop-color="#9CA792"/>
      <stop offset="1" stop-color="#86927C"/>
    </linearGradient>
    <linearGradient id="guard-fill" x1="441" y1="550" x2="528" y2="638" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA51C"/>
      <stop offset=".55" stop-color="#F08000"/>
      <stop offset="1" stop-color="#D76400"/>
    </linearGradient>
    <!-- Keep a solid highlight with a narrow blend into the orange face. -->
    <linearGradient id="handle-highlight" x1="500" y1="516" x2="513.5" y2="529.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB72B"/>
      <stop offset=".52" stop-color="#FFB72B"/>
      <stop offset="1" stop-color="#FF9A0F"/>
    </linearGradient>
    <!-- Restrained shading stays inside the original bevel and shadow planes. -->
    <linearGradient id="handle-fill" x1="513" y1="530" x2="551" y2="568" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A0F"/>
      <stop offset="0.5" stop-color="#F08000"/>
      <stop offset="1" stop-color="#E87900"/>
    </linearGradient>
    <!-- Blend only the narrow edge where the face turns into shadow. -->
    <linearGradient id="handle-shadow" x1="552" y1="562" x2="577" y2="587" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E87900"/>
      <stop offset=".38" stop-color="#D76400"/>
      <stop offset="1" stop-color="#C75C00"/>
    </linearGradient>
    <linearGradient id="bands-shadow" x1="552" y1="562" x2="577" y2="587" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B85000"/>
      <stop offset=".38" stop-color="#A14400"/>
      <stop offset="1" stop-color="#A14400"/>
    </linearGradient>
    <linearGradient id="collar-fill" x1="0" y1="-31" x2="0" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#939C8C"/>
      <stop offset=".16" stop-color="#8D9786"/>
      <stop offset=".28" stop-color="#6C7865"/>
      <stop offset=".65" stop-color="#596650"/>
      <stop offset="1" stop-color="#46533E"/>
    </linearGradient>
    <!-- The curved heel band describes the handle's circular cross-section. -->
    <linearGradient id="heel-band" x1="552" y1="562" x2="577" y2="587" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D76400"/>
      <stop offset=".2" stop-color="#D76400"/>
      <stop offset="1" stop-color="#C75C00"/>
    </linearGradient>

    <linearGradient id="bands-highlight" x1="500" y1="516" x2="513.5" y2="529.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D76400"/>
      <stop offset=".52" stop-color="#D76400"/>
      <stop offset="1" stop-color="#B85000"/>
    </linearGradient>
    <linearGradient id="guard-shadow" x1="478" y1="574" x2="492" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E77800"/>
      <stop offset=".65" stop-color="#D76400"/>
      <stop offset="1" stop-color="#D76400"/>
    </linearGradient>
    <linearGradient id="guard-highlight" x1="438" y1="548" x2="455" y2="565" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB72B"/>
      <stop offset=".35" stop-color="#FFB72B"/>
      <stop offset="1" stop-color="#FA9916"/>
    </linearGradient>
    <clipPath id="handle-clip">
      <path d="M498 516L792 222C814 200 837 208 852 222C877 245 877 274 858 293L567 584C547 605 522 603 501 585C478 564 476 541 498 516Z"/>
    </clipPath>
    <clipPath id="bands-clip">
      <path d="M515 475Q544 536 605 565L615 555Q554 526 525 465Z M543 447Q572 508 633 537L642 528Q581 499 552 438Z M571 419Q600 480 661 509L670 500Q609 471 580 410Z"/>
    </clipPath>
    <clipPath id="guard-clip">
      <path d="M429 553L438 544C446 537 457 537 465 544L534 613C544 623 544 634 535 644L529 650C520 658 509 657 500 649L432 582C421 571 422 562 429 553Z"/>
    </clipPath>
  </defs>

  <!-- Keep the upper-left field neutral; concentrate cream warmth at the lower right. -->
  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- Frame the tip and grip rings; the rest of the handle is outside the canvas. -->
  <g transform="translate(-275.5 -757.25) scale(1.9)">
    <!-- One shared axis aligns the steel tip and collar with the grip and target. -->
    <g transform="translate(290.25 792.25) rotate(-45)">
      <!-- Soft upper-left lighting continues across the tapered metal surfaces. -->
      <path d="M0 0Q0-1.25 3-1.8L174-10V10L3 1.8Q0 1.25 0 0Z" fill="url(#metal)" stroke="#A0A699" stroke-width=".5" stroke-linejoin="round"/>
      <path d="M168-13L251-31V31L168 13Z" fill="url(#collar-fill)"/>
    </g>

    <!-- Clean color faces follow the original highlight and shadow boundaries. -->
    <g clip-path="url(#handle-clip)">
      <rect x="475" y="195" width="410" height="415" fill="url(#handle-fill)"/>
      <path d="M350 764L950 164V215L350 815Z" fill="url(#handle-shadow)"/>
      <!-- Wrap the base of the grip with a narrow collar, behind the guard. -->
      <path d="M504 510L498 516C476 541 478 564 501 585C522 603 547 605 567 584L573 578C553 599 528 597 507 579C484 558 482 535 504 510Z" fill="url(#heel-band)"/>
      <!-- The lit plane continues over the heel; its shadow wraps underneath. -->
      <path d="M350 664L950 64V66L350 666Z" fill="#FFA51C"/>
      <path d="M350 666L950 66V93L350 693Z" fill="url(#handle-highlight)"/>
      <!-- Grip rings bow around the same rounded cross-section as the heel band. -->
      <g clip-path="url(#bands-clip)">
        <rect x="475" y="195" width="410" height="415" fill="#B85000"/>
        <path d="M350 664L950 64V93L350 693Z" fill="url(#bands-highlight)"/>
        <path d="M350 764L950 164V215L350 815Z" fill="url(#bands-shadow)"/>
      </g>
    </g>
    <path d="M498 516L792 222C814 200 837 208 852 222C877 245 877 274 858 293L567 584C547 605 522 603 501 585C478 564 476 541 498 516Z" fill="none" stroke="#D76400" stroke-width="1"/>

    <!-- Preserve the narrower, slightly asymmetric original finger guard. -->
    <path d="M429 553L438 544C446 537 457 537 465 544L534 613C544 623 544 634 535 644L529 650C520 658 509 657 500 649L432 582C421 571 422 562 429 553Z" fill="url(#guard-fill)"/>
    <g clip-path="url(#guard-clip)">
      <path d="M404 496L579 671L593 657L418 482Z" fill="url(#guard-shadow)"/>
      <path d="M429 553L438 544C446 537 457 537 465 544L469 548Q461 546 454 551L438 568L428 558Q426 556 429 553Z" fill="url(#guard-highlight)"/>
    </g>
    <path d="M429 553L438 544C446 537 457 537 465 544L534 613C544 623 544 634 535 644L529 650C520 658 509 657 500 649L432 582C421 571 422 562 429 553Z" fill="none" stroke="#D76400" stroke-width="1"/>

    <!-- Contact target centered on the shared needle/grip axis (x + y = 1082.5). -->
    <circle cx="290.25" cy="792.25" r="113" fill="none" stroke="#C96B00" stroke-width="7"/>
    <circle cx="290.25" cy="792.25" r="73" fill="#F08000" fill-opacity=".10" stroke="#F08000" stroke-width="7"/>
    <circle cx="290.25" cy="792.25" r="29" fill="#F08000"/>
    <circle cx="290.25" cy="792.25" r="11" fill="#FFF8E8"/>
  </g>
</svg>
