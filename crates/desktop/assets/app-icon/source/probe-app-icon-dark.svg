<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Probe app icon — dark</title>
  <desc id="description">The original orange probe, cable and concentric target composition, traced into clean editable vector shapes. Color faces use controlled fills without raster texture.</desc>
  <defs>
    <pattern id="grid" x="1" y="1" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#35363B" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="metal" x1="0" y1="-10" x2="0" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B0B5B2"/>
      <stop offset=".26" stop-color="#F0F3EF"/>
      <stop offset=".44" stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#E2E6E2"/>
      <stop offset="1" stop-color="#939B95"/>
    </linearGradient>
    <linearGradient id="guard-fill" x1="441" y1="550" x2="528" y2="638" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA814"/>
      <stop offset=".55" stop-color="#F29308"/>
      <stop offset="1" stop-color="#E57E02"/>
    </linearGradient>
    <clipPath id="handle-clip">
      <path d="M498 516L792 222C814 200 837 208 852 222C877 245 877 274 858 293L567 584C547 605 522 603 501 585C478 564 476 541 498 516Z"/>
    </clipPath>
    <clipPath id="bands-clip">
      <path d="M470 430L670 630L680 620L480 420Z M498 402L698 602L707 593L507 393Z M526 374L726 574L735 565L535 365Z"/>
    </clipPath>
    <clipPath id="guard-clip">
      <path d="M429 553L438 544C446 537 457 537 465 544L534 613C544 623 544 634 535 644L529 650C520 658 509 657 500 649L432 582C421 571 422 562 429 553Z"/>
    </clipPath>
  </defs>

  <!-- Keep the original graphite field and 64px grid cadence. -->
  <rect width="1024" height="1024" fill="#242529"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- Original target location, radii and fine stroke weights. -->
  <circle cx="286" cy="788" r="113" fill="none" stroke="#9B6309" stroke-width="7"/>
  <circle cx="286" cy="788" r="73" fill="#AA6308" fill-opacity=".30" stroke="#FAA31C" stroke-width="7"/>
  <circle cx="286" cy="788" r="29" fill="#FFB820"/>
  <circle cx="286" cy="788" r="11" fill="#FFF3DE"/>

  <!-- Contours traced in original image coordinates, not an idealized capsule. -->
  <path d="M889 171C928 130 975 94 1024 61V99C982 129 944 162 913 196Z" fill="#494A4B"/>
  <path d="M889 171C928 130 975 94 1024 61V69C978 100 933 136 895 177Z" fill="#58595A"/>
  <path d="M817 212L886 167Q889 165 893 170L914 189Q920 193 918 200L872 271Z" fill="#414244"/>
  <path d="M817 212L886 167L895 177L829 222Z" fill="#656667"/>
  <path d="M878 235L913 188Q920 193 918 200L872 271L857 253Z" fill="#343537"/>

  <!-- One shared axis aligns the steel tip and collar with the grip and target. -->
  <g transform="translate(286 788) rotate(-44.465546)">
    <path d="M0 0Q0-1.25 3-1.8L174-10V10L3 1.8Q0 1.25 0 0Z" fill="url(#metal)" stroke="#ADB4AE" stroke-width="1" stroke-linejoin="round"/>
    <path d="M3-.4L174-3" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M168-13L251-31V31L168 13Z" fill="#434548"/>
    <path d="M168-13L251-31V-18L168-5Z" fill="#7B7D7D"/>
    <path d="M168-5L251-18V31L168 13Z" fill="#47494B"/>
  </g>

  <!-- Clean color faces follow the original highlight and shadow boundaries. -->
  <g clip-path="url(#handle-clip)">
    <rect x="475" y="195" width="410" height="415" fill="#F59A12"/>
    <path d="M350 664L950 64V78L350 678Z" fill="#FFB820"/>
    <path d="M350 678L950 78V101L350 701Z" fill="#FFCB45"/>
    <path d="M350 770L950 170V215L350 815Z" fill="#EA870B"/>
    <!-- The three original grip rings, measured along the diagonal axis. -->
    <g clip-path="url(#bands-clip)">
      <rect x="475" y="195" width="410" height="415" fill="#CC6903"/>
      <path d="M350 664L950 64V101L350 701Z" fill="#E98408"/>
      <path d="M350 770L950 170V215L350 815Z" fill="#BD5C02"/>
    </g>
  </g>
  <path d="M498 516L792 222C814 200 837 208 852 222C877 245 877 274 858 293L567 584C547 605 522 603 501 585C478 564 476 541 498 516Z" fill="none" stroke="#DB8A10" stroke-width="1"/>

  <!-- Preserve the narrower, slightly asymmetric original finger guard. -->
  <path d="M429 553L438 544C446 537 457 537 465 544L534 613C544 623 544 634 535 644L529 650C520 658 509 657 500 649L432 582C421 571 422 562 429 553Z" fill="url(#guard-fill)"/>
  <g clip-path="url(#guard-clip)">
    <path d="M380 520L555 695L566 684L391 509Z" fill="#FFA912"/>
    <path d="M404 496L579 671L593 657L418 482Z" fill="#E48706"/>
    <path d="M400 500H500L400 600Z" fill="#FFC031"/>
  </g>
  <path d="M429 553L438 544C446 537 457 537 465 544L534 613C544 623 544 634 535 644L529 650C520 658 509 657 500 649L432 582C421 571 422 562 429 553Z" fill="none" stroke="#D48108" stroke-width="1"/>
</svg>
