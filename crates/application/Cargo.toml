[package]
name = "probe-application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
probe-core = { path = "../core" }
probe-http = { path = "../http" }
probe-websocket = { path = "../websocket" }
tokio = { version = "1.53.1", features = ["rt", "macros", "sync"] }

[dev-dependencies]
probe-opencollection = { path = "../opencollection" }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "test-util"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[lints]
workspace = true
