[package]
name = "probe-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
probe-core = { path = "../core" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "multipart", "stream", "form", "query"] }
pkcs8 = { version = "0.10.2", features = ["pem", "encryption", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
# RustCrypto format/KDF support; PBES2 decryption stays entirely in Rust.
pkcs12 = { version = "0.2.0-pre.0", default-features = false, features = ["kdf"] }
# Upstream pbes2 bundles scrypt/salsa20; no independent opt-out exists.
pkcs5 = { version = "0.8", default-features = false, features = ["pbes2", "sha1-insecure"] }
der = { version = "0.8", features = ["alloc", "derive", "pem"] }
x509-cert = { version = "0.3", default-features = false, features = ["pem"] }
hmac = "0.13"
sha1 = "0.11"
zeroize = "1.9.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "fs", "net", "io-util", "sync"] }

[lints]
workspace = true
