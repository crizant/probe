[package]
name = "probe-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
probe-core = { path = "../core" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "multipart", "stream", "form", "query"] }
pkcs8 = { version = "0.10.2", features = ["pem", "encryption", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
zeroize = "1.9.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "fs", "net", "io-util", "sync"] }

[lints]
workspace = true
