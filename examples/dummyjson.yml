      type: text/markdown
    items:
      - info:
          name: Generate TOTP (GET)
          type: http
          seq: 1
          description: Generate a TOTP code using query parameters.
        http:
          method: GET
          url: '{{baseUrl}}/2fa'
          params:
            - name: key
              value: JBSWY3DPEHPK3PXP
              type: query
        docs: |
          Generate a TOTP code using query parameters. Endpoint: GET /2fa. Query parameters: key. Uses DummyJSON's sample Base32 secret. POST is preferable for real secrets.
      - info:
          name: Generate TOTP (POST)
          type: http
          seq: 2
          description: Generate a TOTP code from a JSON request body.
        http:
          method: POST
          url: '{{baseUrl}}/2fa'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: '{"key":"JBSWY3DPEHPK3PXP"}'
        docs: |
          Generate a TOTP code from a JSON request body. Endpoint: POST /2fa. Body type: json. Keeps the TOTP secret out of the URL.
      - info:
          name: Generate Custom Response API
          type: http
          seq: 3
          description: Create a custom response definition using DummyJSON developer tools.
        http:
          method: POST
          url: '{{baseUrl}}/c/generate'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: '{"json":{"message":"Hello from Probe"},"method":"GET"}'
        docs: |
          Create a custom response definition using DummyJSON developer tools. Endpoint: POST /c/generate. Body type: json. Returns a temporary custom API URL. DummyJSON says generated responses expire after 90 days.
