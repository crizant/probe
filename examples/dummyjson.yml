opencollection: 1.0.0
info:
  name: DummyJSON
  summary: Runnable DummyJSON collection demonstrating Probe and OpenCollection workflows
  version: 1.0.0
bundled: true
docs:
  content: |
    # DummyJSON demo collection

    A bundled OpenCollection designed to showcase Probe with real, runnable DummyJSON endpoints.
    It covers common REST workflows, authentication, environment inheritance, secret variables, simulated CRUD, HTTP status testing, image responses, TOTP, custom responses, and temporary webhooks.

    ## Try it in Probe

    Choose an environment, open any folder, and run a request. The child environments inherit shared defaults from `Base` while overriding a few values so you can see inheritance in the Environment Manager.

    ## Authentication

    Run **Auth / Login** with DummyJSON's public demo credentials. Copy the returned `accessToken` and `refreshToken` into the matching secret variables for the environment you are using before running authenticated requests.

    ## Simulated writes

    DummyJSON returns realistic POST, PATCH, and DELETE responses, but changes are generally not persisted to the underlying dataset.

    ## Developer tools

    For webhook examples, create a webhook first and replace `webhookId`. To delete a captured request, also set `webhookRequestId` from the request listing.

    Base URL: https://dummyjson.com
  type: text/markdown
config:
  environments:
    - name: Base
      description: Shared defaults for the entire DummyJSON demo. Other environments inherit these 
        values and override only what they need.
      variables:
        - name: baseUrl
          value: https://dummyjson.com
        - name: productId
          value: '1'
        - name: productCategory
          value: smartphones
        - name: productSearch
          value: phone
        - name: userId
          value: '5'
        - name: userSearch
          value: John
        - name: cartId
          value: '1'
        - name: postId
          value: '6'
        - name: postSearch
          value: love
        - name: postTag
          value: life
        - name: commentId
          value: '1'
        - name: todoId
          value: '1'
        - name: quoteId
          value: '1'
        - name: recipeId
          value: '1'
        - name: recipeSearch
          value: Margherita
        - name: recipeTag
          value: Pakistani
        - name: mealType
          value: snack
        - name: accessToken
          secret: true
          type: string
        - name: refreshToken
          secret: true
          type: string
        - name: webhookId
          value: replace-me
        - name: webhookRequestId
          value: replace-me
    - name: Development
      extends: Base
      description: Developer-friendly overrides for quickly exercising different records, searches, 
        and categories.
      variables:
        - name: productId
          value: '2'
        - name: productCategory
          value: laptops
        - name: productSearch
          value: laptop
        - name: userId
          value: '1'
        - name: userSearch
          value: Emily
        - name: recipeSearch
          value: Chicken
        - name: mealType
          value: dinner
        - name: accessToken
          secret: true
          type: string
        - name: refreshToken
          secret: true
          type: string
    - name: Staging
      extends: Base
      description: QA-style overrides that keep the same public API while testing another set of 
        IDs, tags, and filters.
      variables:
        - name: productId
          value: '8'
        - name: productCategory
          value: groceries
        - name: userId
          value: '10'
        - name: postId
          value: '12'
        - name: postTag
          value: history
        - name: recipeTag
          value: Italian
        - name: mealType
          value: lunch
        - name: accessToken
          secret: true
          type: string
        - name: refreshToken
          secret: true
          type: string
    - name: Production
      extends: Base
      description: Production-shaped demo values. It still targets DummyJSON, but shows how a real 
        environment can inherit shared defaults and override a small subset.
      variables:
        - name: productId
          value: '15'
        - name: productSearch
          value: phone
        - name: userId
          value: '20'
        - name: userSearch
          value: Michael
        - name: postTag
          value: love
        - name: recipeSearch
          value: Pasta
        - name: recipeTag
          value: Asian
        - name: accessToken
          secret: true
          type: string
        - name: refreshToken
          secret: true
          type: string
items:
  - info:
      name: General
      type: folder
      seq: 1
      description: Small utility endpoints for connectivity, client information, and request timing 
        demos.
    docs:
      content: |
        Use these endpoints for quick smoke tests before working with the larger resource folders. The delayed response is especially useful for demonstrating Probe request progress and cancellation.
      type: text/markdown
    items:
      - info:
          name: Test Route
          type: http
          seq: 1
          description: Check that the DummyJSON service is reachable with a minimal test request.
        http:
          method: GET
          url: '{{baseUrl}}/test'
        docs: |
          Check that the DummyJSON service is reachable with a minimal test request. Endpoint: GET /test. Basic health/test route. DummyJSON accepts multiple HTTP methods on this route.
      - info:
          name: Client IP
          type: http
          seq: 2
          description: Return the caller IP address and user-agent information.
        http:
          method: GET
          url: '{{baseUrl}}/ip'
        docs: |
          Return the caller IP address and user-agent information. Endpoint: GET /ip. Returns the client IP address and user-agent information.
      - info:
          name: Delayed Products Response
          type: http
          seq: 3
          description: Load a small product response with an artificial delay.
        http:
          method: GET
          url: '{{baseUrl}}/products'
          params:
            - name: limit
              value: '3'
              type: query
            - name: delay
              value: '1000'
              type: query
        docs: |
          Load a small product response with an artificial delay. Endpoint: GET /products. Query parameters: limit, delay. Adds a 1000 ms artificial server delay. Useful for testing Probe loading states and cancellation.
  - info:
      name: Auth
      type: folder
      seq: 2
      description: Authentication examples covering login, bearer-authenticated requests, and token 
        refresh.
    docs:
      content: |
        Start with Login, then store the returned access and refresh tokens in the selected environment secrets. Current Auth User and Authorized Products demonstrate bearer authentication, while Refresh Token exercises token renewal.
      type: text/markdown
    items:
      - info:
          name: Login
          type: http
          seq: 1
          description: Authenticate with DummyJSON demo credentials and receive access and refresh 
            tokens.
        http:
          method: POST
          url: '{{baseUrl}}/auth/login'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: '{"username":"emilys","password":"emilyspass","expiresInMins":30}'
        docs: |
          Authenticate with DummyJSON demo credentials and receive access and refresh tokens. Endpoint: POST /auth/login. Body type: json. Uses DummyJSON's public demo credentials. Copy returned tokens into the environment secrets.
      - info:
          name: Current Auth User
          type: http
          seq: 2
          description: Return the user represented by the current bearer access token.
        http:
          method: GET
          url: '{{baseUrl}}/auth/me'
          auth:
            type: bearer
            token: '{{accessToken}}'
        docs: |
          Return the user represented by the current bearer access token. Endpoint: GET /auth/me. Authentication: bearer. Environment values: accessToken. Requires an access token returned by Login.
      - info:
          name: Refresh Token
          type: http
          seq: 3
          description: Exchange a refresh token for a new access token.
        http:
          method: POST
          url: '{{baseUrl}}/auth/refresh'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: '{"refreshToken":"{{refreshToken}}","expiresInMins":30}'
        docs: |
          Exchange a refresh token for a new access token. Endpoint: POST /auth/refresh. Body type: json. Environment values: refreshToken. Refreshes the access token. Set refreshToken in the environment first.
      - info:
          name: Authorized Products
          type: http
          seq: 4
          description: List products through an authenticated DummyJSON resource route.
        http:
          method: GET
          url: '{{baseUrl}}/auth/products'
          params:
            - name: limit
              value: '5'
              type: query
          auth:
            type: bearer
            token: '{{accessToken}}'
        docs: |
          List products through an authenticated DummyJSON resource route. Endpoint: GET /auth/products. Query parameters: limit. Authentication: bearer. Environment values: accessToken. DummyJSON supports accessing resources under /auth/RESOURCE with a bearer token.
  - info:
      name: Products
      type: folder
      seq: 3
      description: Explore the DummyJSON product catalogue with browsing, search, filtering, 
        categories, and simulated CRUD operations.
    docs:
      content: |
        Use these requests to browse and modify the DummyJSON product catalogue.

        Start with List Products or Search Products for common read operations. Category endpoints demonstrate filtering, while Add Product, Update Product, and Delete Product cover simulated write operations.

        DummyJSON does not persist changes made by POST, PATCH, or DELETE. Use the productId, productCategory, and productSearch environment variables to change test values without editing individual requests.
      type: text/markdown
    items:
      - info:
          name: List Products
          type: http
          seq: 1
          description: List products with the request's configured paging or field-selection 
            options.
        http:
          method: GET
          url: '{{baseUrl}}/products'
          params:
            - name: limit
              value: '10'
              type: query
            - name: skip
              value: '0'
              type: query
            - name: select
              value: title,price,category
              type: query
        docs: |
          List products with the request's configured paging or field-selection options. Endpoint: GET /products. Query parameters: limit, skip, select.
      - info:
          name: Get Product
          type: http
          seq: 2
          description: Fetch one product by its environment-driven ID.
        http:
          method: GET
          url: '{{baseUrl}}/products/:productId'
          params:
            - name: productId
              value: '{{productId}}'
              type: path
        docs: |
          Fetch one product by its environment-driven ID. Endpoint: GET /products/:productId. Path parameters: productId. Environment values: productId.
      - info:
          name: Search Products
          type: http
          seq: 3
          description: Search products using the query value from the selected environment.
        http:
          method: GET
          url: '{{baseUrl}}/products/search'
          params:
            - name: q
              value: '{{productSearch}}'
              type: query
        docs: |
          Search products using the query value from the selected environment. Endpoint: GET /products/search. Query parameters: q. Environment values: productSearch.
      - info:
          name: Sort Products
          type: http
          seq: 4
          description: Sort the product list using explicit sort field and direction parameters.
        http:
          method: GET
          url: '{{baseUrl}}/products'
          params:
            - name: sortBy
              value: title
              type: query
            - name: order
              value: asc
              type: query
        docs: |
          Sort the product list using explicit sort field and direction parameters. Endpoint: GET /products. Query parameters: sortBy, order.
      - info:
          name: Filter Products by Modified Date
          type: http
          seq: 5
          description: Filter products using a modified-after timestamp and a reduced field 
            selection.
        http:
          method: GET
          url: '{{baseUrl}}/products'
          params:
            - name: modifiedAfter
              value: '2026-06-01T00:00:00Z'
              type: query
            - name: select
              value: title,meta
              type: query
        docs: |
          Filter products using a modified-after timestamp and a reduced field selection. Endpoint: GET /products. Query parameters: modifiedAfter, select.
      - info:
          name: Product Categories
          type: http
          seq: 6
          description: Return product categories with their display metadata.
        http:
          method: GET
          url: '{{baseUrl}}/products/categories'
        docs: |
          Return product categories with their display metadata. Endpoint: GET /products/categories.
      - info:
          name: Product Category List
          type: http
          seq: 7
          description: Return the compact list of product category slugs.
        http:
          method: GET
          url: '{{baseUrl}}/products/category-list'
        docs: |
          Return the compact list of product category slugs. Endpoint: GET /products/category-list.
      - info:
          name: Products by Category
          type: http
          seq: 8
          description: List products filtered by the category selected in the environment.
        http:
          method: GET
          url: '{{baseUrl}}/products/category/:category'
          params:
            - name: category
              value: '{{productCategory}}'
              type: path
        docs: |
          List products filtered by the category selected in the environment. Endpoint: GET /products/category/:category. Path parameters: category. Environment values: productCategory.
      - info:
          name: Add Product
          type: http
          seq: 9
          description: Create a simulated product using a JSON request body.
        http:
          method: POST
          url: '{{baseUrl}}/products/add'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: '{"title":"Probe Test Product","price":19.99,"category":"test"}'
        docs: |
          Create a simulated product using a JSON request body. Endpoint: POST /products/add. Body type: json. DummyJSON simulates this write; the underlying dataset is not permanently changed.
      - info:
          name: Update Product
          type: http
          seq: 10
          description: Update a simulated product selected by its environment-driven ID.
        http:
          method: PATCH
          url: '{{baseUrl}}/products/:productId'
          headers:
            - name: Content-Type
              value: application/json
          params:
            - name: productId
              value: '{{productId}}'
              type: path
          body:
            type: json
            data: '{"title":"Probe Updated Product"}'
        docs: |
          Update a simulated product selected by its environment-driven ID. Endpoint: PATCH /products/:productId. Path parameters: productId. Body type: json. Environment values: productId. DummyJSON simulates this write; the underlying dataset is not permanently changed.
      - info:
          name: Delete Product
          type: http
          seq: 11
          description: Delete a simulated product selected by its environment-driven ID.
        http:
          method: DELETE
          url: '{{baseUrl}}/products/:productId'
          params:
            - name: productId
              value: '{{productId}}'
              type: path
        docs: |
          Delete a simulated product selected by its environment-driven ID. Endpoint: DELETE /products/:productId. Path parameters: productId. Environment values: productId. DummyJSON simulates this write; the underlying dataset is not permanently changed.
  - info:
      name: Users
      type: folder
      seq: 4
      description: Browse, search, filter, and modify users, including their related carts, posts, 
        and todos.
    docs:
      content: |
        This folder demonstrates a typical user resource with list/detail views, search and filtering, nested related-resource routes, and simulated CRUD. Change userId and userSearch in the selected environment to explore different records.
      type: text/markdown
    items:
      - info:
          name: List Users
          type: http
          seq: 1
          description: List users with the request's configured paging or field-selection options.
        http:
          method: GET
          url: '{{baseUrl}}/users'
          params:
            - name: limit
              value: '10'
              type: query
            - name: skip
              value: '0'
              type: query
            - name: select
              value: firstName,lastName,email
              type: query
        docs: |
          List users with the request's configured paging or field-selection options. Endpoint: GET /users. Query parameters: limit, skip, select.
      - info:
          name: Get User
          type: http
          seq: 2
          description: Fetch one user by its environment-driven ID.
        http:
          method: GET
          url: '{{baseUrl}}/users/:userId'
          params:
            - name: userId
              value: '{{userId}}'
              type: path
        docs: |
          Fetch one user by its environment-driven ID. Endpoint: GET /users/:userId. Path parameters: userId. Environment values: userId.
      - info:
          name: Search Users
          type: http
          seq: 3
          description: Search users using the query value from the selected environment.
        http:
          method: GET
          url: '{{baseUrl}}/users/search'
          params:
            - name: q
              value: '{{userSearch}}'
              type: query
        docs: |
          Search users using the query value from the selected environment. Endpoint: GET /users/search. Query parameters: q. Environment values: userSearch.
      - info:
          name: Filter Users
          type: http
          seq: 4
          description: Filter users by a nested field and value.
        http:
          method: GET
          url: '{{baseUrl}}/users/filter'
          params:
            - name: key
              value: hair.color
              type: query
            - name: value
              value: Brown
              type: query
        docs: |
          Filter users by a nested field and value. Endpoint: GET /users/filter. Query parameters: key, value.
      - info:
          name: User Carts
          type: http
          seq: 5
          description: List carts related to the user selected in the environment.
        http:
          method: GET
          url: '{{baseUrl}}/users/:userId/carts'
          params:
            - name: userId
              value: '{{userId}}'
              type: path
        docs: |
          List carts related to the user selected in the environment. Endpoint: GET /users/:userId/carts. Path parameters: userId. Environment values: userId.
      - info:
          name: User Posts
          type: http
          seq: 6
          description: List posts related to the user selected in the environment.
        http:
          method: GET
          url: '{{baseUrl}}/users/:userId/posts'
          params:
            - name: userId
              value: '{{userId}}'
              type: path
        docs: |
          List posts related to the user selected in the environment. Endpoint: GET /users/:userId/posts. Path parameters: userId. Environment values: userId.
      - info:
          name: User Todos
          type: http
          seq: 7
          description: List todos related to the user selected in the environment.
        http:
          method: GET
          url: '{{baseUrl}}/users/:userId/todos'
          params:
            - name: userId
              value: '{{userId}}'
              type: path
        docs: |
          List todos related to the user selected in the environment. Endpoint: GET /users/:userId/todos. Path parameters: userId. Environment values: userId.
      - info:
          name: Add User
          type: http
          seq: 8
          description: Create a simulated user using a JSON request body.
        http:
          method: POST
          url: '{{baseUrl}}/users/add'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: '{"firstName":"Probe","lastName":"Tester","age":30}'
        docs: |
          Create a simulated user using a JSON request body. Endpoint: POST /users/add. Body type: json. DummyJSON simulates this write; the underlying dataset is not permanently changed.
      - info:
          name: Update User
          type: http
          seq: 9
          description: Update a simulated user selected by its environment-driven ID.
        http:
          method: PATCH
          url: '{{baseUrl}}/users/:userId'
          headers:
            - name: Content-Type
              value: application/json
          params:
            - name: userId
              value: '{{userId}}'
              type: path
          body:
            type: json
            data: '{"lastName":"Updated by Probe"}'
        docs: |
          Update a simulated user selected by its environment-driven ID. Endpoint: PATCH /users/:userId. Path parameters: userId. Body type: json. Environment values: userId. DummyJSON simulates this write; the underlying dataset is not permanently changed.
      - info:
          name: Delete User
          type: http
          seq: 10
          description: Delete a simulated user selected by its environment-driven ID.
        http:
          method: DELETE
          url: '{{baseUrl}}/users/:userId'
          params:
            - name: userId
              value: '{{userId}}'
              type: path
        docs: |
          Delete a simulated user selected by its environment-driven ID. Endpoint: DELETE /users/:userId. Path parameters: userId. Environment values: userId. DummyJSON simulates this write; the underlying dataset is not permanently changed.
  - info:
      name: Carts
      type: folder
      seq: 5
      description: Work with shopping carts, user-specific cart queries, and simulated cart 
        mutations.
    docs:
      content: |
        Use the read requests to inspect carts and relationships to users and products. Add, Update, and Delete demonstrate request bodies and simulated mutations without permanently changing DummyJSON data.
      type: text/markdown
    items:
      - info:
          name: List Carts
          type: http
          seq: 1
          description: List carts with the request's configured paging or field-selection options.
        http:
          method: GET
          url: '{{baseUrl}}/carts'
          params:
            - name: limit
              value: '10'
              type: query
            - name: skip
              value: '0'
              type: query
        docs: |
          List carts with the request's configured paging or field-selection options. Endpoint: GET /carts. Query parameters: limit, skip.
      - info:
          name: Get Cart
          type: http
          seq: 2
          description: Fetch one cart by its environment-driven ID.
        http:
          method: GET
          url: '{{baseUrl}}/carts/:cartId'
          params:
            - name: cartId
              value: '{{cartId}}'
              type: path
        docs: |
          Fetch one cart by its environment-driven ID. Endpoint: GET /carts/:cartId. Path parameters: cartId. Environment values: cartId.
      - info:
          name: Carts by User
          type: http
          seq: 3
          description: List carts belonging to the user selected in the environment.
        http:
          method: GET
          url: '{{baseUrl}}/carts/user/:userId'
          params:
            - name: userId
              value: '{{userId}}'
              type: path
        docs: |
          List carts belonging to the user selected in the environment. Endpoint: GET /carts/user/:userId. Path parameters: userId. Environment values: userId.
      - info:
          name: Add Cart
          type: http
          seq: 4
          description: Create a simulated cart using a JSON request body.
        http:
          method: POST
          url: '{{baseUrl}}/carts/add'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: '{"userId":1,"products":[{"id":1,"quantity":2},{"id":2,"quantity":1}]}'
        docs: |
          Create a simulated cart using a JSON request body. Endpoint: POST /carts/add. Body type: json. DummyJSON simulates this write; the underlying dataset is not permanently changed.
      - info:
          name: Update Cart
          type: http
          seq: 5
          description: Update a simulated cart selected by its environment-driven ID.
        http:
          method: PATCH
          url: '{{baseUrl}}/carts/:cartId'
          headers:
            - name: Content-Type
              value: application/json
          params:
            - name: cartId
              value: '{{cartId}}'
              type: path
          body:
            type: json
            data: '{"merge":true,"products":[{"id":1,"quantity":1}]}'
        docs: |
          Update a simulated cart selected by its environment-driven ID. Endpoint: PATCH /carts/:cartId. Path parameters: cartId. Body type: json. Environment values: cartId. DummyJSON simulates this write; the underlying dataset is not permanently changed.
      - info:
          name: Delete Cart
          type: http
          seq: 6
          description: Delete a simulated cart selected by its environment-driven ID.
        http:
          method: DELETE
          url: '{{baseUrl}}/carts/:cartId'
          params:
            - name: cartId
              value: '{{cartId}}'
              type: path
        docs: |
          Delete a simulated cart selected by its environment-driven ID. Endpoint: DELETE /carts/:cartId. Path parameters: cartId. Environment values: cartId. DummyJSON simulates this write; the underlying dataset is not permanently changed.
  - info:
      name: Posts
      type: folder
      seq: 6
      description: Browse and search posts, explore tags and user relationships, and try simulated 
        CRUD.
    docs:
      content: |
        The post endpoints demonstrate pagination, free-text search, tag filtering, user relationships, and write operations. postId, postSearch, postTag, and userId are environment-driven so the same requests can be reused across demo environments.
      type: text/markdown
    items:
      - info:
          name: List Posts
          type: http
          seq: 1
          description: List posts with the request's configured paging or field-selection options.
        http:
          method: GET
          url: '{{baseUrl}}/posts'
          params:
            - name: limit
              value: '10'
              type: query
            - name: skip
              value: '0'
              type: query
            - name: select
              value: title,reactions,userId
              type: query
        docs: |
          List posts with the request's configured paging or field-selection options. Endpoint: GET /posts. Query parameters: limit, skip, select.
      - info:
          name: Get Post
          type: http
          seq: 2
          description: Fetch one post by its environment-driven ID.
        http:
          method: GET
          url: '{{baseUrl}}/posts/:postId'
          params:
            - name: postId
              value: '{{postId}}'
              type: path
        docs: |
          Fetch one post by its environment-driven ID. Endpoint: GET /posts/:postId. Path parameters: postId. Environment values: postId.
      - info:
          name: Search Posts
          type: http
          seq: 3
          description: Search posts using the query value from the selected environment.
        http:
          method: GET
          url: '{{baseUrl}}/posts/search'
          params:
            - name: q
              value: '{{postSearch}}'
              type: query
        docs: |
          Search posts using the query value from the selected environment. Endpoint: GET /posts/search. Query parameters: q. Environment values: postSearch.
      - info:
          name: Post Tags
          type: http
          seq: 4
          description: Return post tags with their associated metadata.
        http:
          method: GET
          url: '{{baseUrl}}/posts/tags'
        docs: |
          Return post tags with their associated metadata. Endpoint: GET /posts/tags.
      - info:
          name: Post Tag List
          type: http
          seq: 5
          description: Return the compact list of post tag names.
        http:
          method: GET
          url: '{{baseUrl}}/posts/tag-list'
        docs: |
          Return the compact list of post tag names. Endpoint: GET /posts/tag-list.
      - info:
          name: Posts by Tag
          type: http
          seq: 6
          description: List posts filtered by the tag selected in the environment.
        http:
          method: GET
          url: '{{baseUrl}}/posts/tag/:tag'
          params:
            - name: tag
              value: '{{postTag}}'
              type: path
        docs: |
          List posts filtered by the tag selected in the environment. Endpoint: GET /posts/tag/:tag. Path parameters: tag. Environment values: postTag.
      - info:
