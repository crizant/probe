          params:
            - name: webhookId
              value: '{{webhookId}}'
              type: path
          body:
            type: json
            data: '{"event":"order.created","source":"Probe"}'
        docs: |
          Send a sample request to the currently selected temporary webhook. Endpoint: POST /webhook/:webhookId. Path parameters: webhookId. Body type: json. Environment values: webhookId. Set webhookId from Create Webhook before running.
      - info:
          name: List Webhook Requests
          type: http
          seq: 6
          description: List requests captured by the selected temporary webhook.
        http:
