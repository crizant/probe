opencollection: 1.0.0
info:
  name: Assertion persistence
bundled: true
items:
  - info:
      name: List users
      type: http
    http:
      method: GET
      url: https://example.com/users
    runtime:
      scripts:
        - type: before-request
          code: console.log('preserve scripts');
      assertions:
        - expression: response.status
          operator: equals
          value: "200"
          disabled: false
          description: Response status should be 200
        - expression: response.body.users.length
          operator: greaterThan
          value: "0"
          disabled: false
        - expression: ' response.body.name '
          operator: equals
          value: ""
          disabled: true
          description:
            content: '**An empty name**'
            type: text/markdown
        - expression: response.body.token
          operator: isDefined
          description: null
  - info:
      name: Query users
      type: graphql
    graphql:
      method: POST
      url: https://example.com/graphql
      body:
        query: '{ users { name } }'
    runtime:
      assertions:
        - expression: response.body.data.users.length
          operator: greaterThan
          value: '{{minimumUsers}}'
          disabled: true
          description: GraphQL users
