opencollection: 1.0.0
info:
  name: Request presentation
bundled: true
items:
  - info:
      name: Get user
      type: http
    http:
      method: GET
      url: https://example.com/users/:id
      headers:
        - name: Accept
          value: application/json
        - name: X-Debug
          value: 'true'
          disabled: true
      params:
        - name: id
          value: '123'
          type: path
        - name: unused
          value: '{{literal}}'
          type: path
          disabled: true
        - name: limit
          value: '20'
          type: query
        - name: offset
          value: '10'
          type: query
          disabled: true
  - info:
      name: Empty
      type: http
    http:
      method: GET
      url: https://example.com
