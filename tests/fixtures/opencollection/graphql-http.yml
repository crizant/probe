opencollection: 1.0.0
info:
  name: GraphQL over HTTP fixture
bundled: true
config:
  environments:
    - name: local
      variables:
        - name: serverUrl
          value: __SERVER_URL__
        - name: login
          value: octocat
items:
  - info:
      name: Query viewer
      type: http
      seq: 1
    http:
      method: POST
      url: "{{serverUrl}}/graphql"
      body:
        type: json
        data: |-
          {
            "query": "query Viewer($login: String!) { viewer(login: $login) { login } }",
            "variables": { "login": "{{login}}" },
            "operationName": "Viewer"
          }
