name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check advisories

  quality:
    name: Coverage and CRAP
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - run: cargo install cargo-crap --locked --version 0.5.0
      - run: cargo llvm-cov --workspace --all-features --json --output-path target/coverage.json
      - run: cargo llvm-cov report --lcov --output-path target/coverage.lcov
      - run: python3 scripts/check-coverage.py target/coverage.json target/coverage.lcov
      - run: cargo crap --workspace --lcov target/coverage.lcov --format json --output target/crap.json
      - run: test -s target/crap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            target/coverage.json
            target/coverage.lcov
            target/crap.json
          if-no-files-found: ignore

  mutation:
    name: Diff mutation (behavior crates)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Find changed behavior source
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p target
          git diff --unified=0 "$BASE_SHA...$HEAD_SHA" -- \
            crates/cli/src crates/core/src crates/http/src \
            crates/opencollection/src crates/postman/src crates/yaak/src \
            > target/mutants.diff
          git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            crates/cli/src crates/core/src crates/http/src \
            crates/opencollection/src crates/postman/src crates/yaak/src \
            > target/mutants-files.txt
          if grep -q '\.rs$' target/mutants-files.txt; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: cargo install cargo-mutants --locked --version 27.1.0
      - if: steps.diff.outputs.changed == 'true'
        run: cargo mutants --workspace --in-diff target/mutants.diff -j 2
