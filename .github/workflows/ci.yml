name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Test release notes extraction
        shell: bash
        run: bash scripts/test-release-notes.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check advisories

  quality:
    name: Coverage and CRAP
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/llvm-cov-target"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-crap@0.5.0
          fallback: none
      - run: cargo llvm-cov --workspace --all-features --json --output-path target/coverage.json
      - run: cargo llvm-cov report --lcov --output-path target/coverage.lcov
      - run: python3 scripts/check-coverage.py target/coverage.json target/coverage.lcov
      - run: cargo crap --workspace --lcov target/coverage.lcov --format json --output target/crap.json
      - run: test -s target/crap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            target/coverage.json
            target/coverage.lcov
            target/crap.json
          if-no-files-found: ignore

  mutation:
    name: Diff mutation (behavior crates)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Find changed behavior source
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p target
          git diff --unified=0 "$BASE_SHA...$HEAD_SHA" -- \
            crates/application/src crates/cli/src crates/core/src crates/http/src \
            crates/opencollection/src crates/postman/src crates/yaak/src \
            > target/mutants.diff
          git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            crates/application/src crates/cli/src crates/core/src crates/http/src \
            crates/opencollection/src crates/postman/src crates/yaak/src \
            > target/mutants-files.txt
          if grep -q '\.rs$' target/mutants-files.txt; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Mutant builds use temporary directories, so only cache Cargo downloads.
          cache-targets: "false"
      - if: steps.diff.outputs.changed == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - if: steps.diff.outputs.changed == 'true'
        env:
          # Override rust-cache's default for repeated builds of mutated source.
          CARGO_INCREMENTAL: "1"
        run: cargo mutants --workspace --in-diff target/mutants.diff -j 2
