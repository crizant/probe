name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Only superseded runs of the same PR share a group. Push runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: MSRV check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Test release notes extraction
        shell: bash
        run: bash scripts/test-release-notes.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  rpm:
    name: RPM packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install RPM packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            cpio \
            desktop-file-utils \
            file \
            gcc \
            libc6-dev \
            rpm
      - name: Validate RPM packages
        run: bash scripts/test-rpm.sh

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check advisories

  quality:
    name: Coverage and CRAP
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/llvm-cov-target"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-crap@0.5.0
          fallback: none
      - run: cargo llvm-cov --workspace --all-features --json --output-path target/coverage.json
      - run: cargo llvm-cov report --lcov --output-path target/coverage.lcov
      - run: python3 scripts/check-coverage.py target/coverage.json target/coverage.lcov
      - run: cargo crap --workspace --lcov target/coverage.lcov --format json --output target/crap.json
      - run: test -s target/crap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            target/coverage.json
            target/coverage.lcov
            target/crap.json
          if-no-files-found: ignore

  mutation:
    name: Diff mutation (behavior crates)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Find changed behavior source
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Cache restore may clean target/ on a partial hit; keep inputs outside it.
          git diff --unified=0 "$BASE_SHA...$HEAD_SHA" -- \
            crates/application/src crates/cli/src crates/core/src crates/http/src \
            crates/opencollection/src crates/postman/src crates/yaak/src \
            > "$RUNNER_TEMP/mutants.diff"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            crates/application/src crates/cli/src crates/core/src crates/http/src \
            crates/opencollection/src crates/postman/src crates/yaak/src \
            > "$RUNNER_TEMP/mutants-files.txt"
          if grep -q '\.rs$' "$RUNNER_TEMP/mutants-files.txt"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # 27.1.0's copied target seed rebuilt dependencies in the measured trial.
          # Keep downloads cached; do not share writable targets between workers.
          cache-targets: "false"
      - if: steps.diff.outputs.changed == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - name: Run diff mutation gate
        if: steps.diff.outputs.changed == 'true'
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          cpus=$(getconf _NPROCESSORS_ONLN)
          export MUTANTS_JOBSERVER_TASKS="$cpus"
          # Preserve the test-thread budget from the wrapper's half-CPU default.
          test_threads=$((cpus / 2 / 2))
          export MUTANTS_TEST_THREADS=$((test_threads > 0 ? test_threads : 1))
          echo "Mutation runner logical CPUs: $cpus"
          # Benchmark-only telemetry; excluded from the proposed CI change.
          (
            while true; do
              date -u
              top -l 1 -n 0 | head -n 12
              memory_pressure -Q
              sysctl vm.swapusage
              sleep 15
            done
          ) > "$RUNNER_TEMP/mutation-resources.log" 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          scripts/run-mutants.sh "$RUNNER_TEMP/mutants.diff"
      - name: Upload mutation reports
        if: always() && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: |
            mutants.out/
            ${{ runner.temp }}/mutation-resources.log
            ${{ runner.temp }}/mutants.diff
            ${{ runner.temp }}/mutants-files.txt
          if-no-files-found: warn
