name: Temporary PEM scoped validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format and resolve dependencies
        run: |
          cargo fmt
          cargo generate-lockfile
          git add -N crates/application/src/client_certificate.rs crates/core/tests/client_certificate_matching.rs crates/http/src/identity.rs crates/http/src/mtls_tests.rs
          python3 - <<'PY'
          import base64, subprocess, zlib
          patch = subprocess.check_output(['git', 'diff', '--binary'])
          print('PEM_PATCH_START' + base64.b64encode(zlib.compress(patch)).decode() + 'PEM_PATCH_END')
          PY
      - name: Scoped behavior tests
        run: cargo test -p probe-core -p probe-http -p probe-application -p probe-cli
